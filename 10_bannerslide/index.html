<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>설화수 추천 상품 슬라이드</title>


  <!-- =========================================
       Swiper CSS
  ========================================== -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  >


  <!-- =========================================
       사용자 CSS
  ========================================== -->
  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>


<body>


  <!-- =========================================
       설화수 추천 SECTION 시작
  ========================================== -->
  <section class="recommend-section">

    <!-- 가운데 정렬 INNER -->
    <div class="recommend-inner">


      <!-- =========================================
           SECTION 제목
      ========================================== -->
      <div class="recommend-title">

        <h2>설화수 추천</h2>

      </div>
      <!-- SECTION 제목 끝 -->



      <!-- =========================================
           SLIDE SECTION
      ========================================== -->
      <div class="slide-section">


        <!-- =========================================
             Swiper
        ========================================== -->
        <div class="swiper productSwiper">


          <!-- =========================================
               Swiper Wrapper
          ========================================== -->
          <div class="swiper-wrapper">


            <!-- =====================================
                 SLIDE 01
            ====================================== -->
            <div class="swiper-slide">

              <div class="product-card">

                <!-- 상품 이미지 -->
                <div class="product-image">

                  <img
                    src="./images/347cecca1df328f18b191fc833e506f2.jpg"
                    alt="탄력크림 EX"
                  >

                </div>


                <!-- 상품 정보 -->
                <div class="product-info">

                  <h3>탄력크림 EX</h3>

                  <p class="product-eng">
                    Essential Firming Cream EX
                  </p>

                  <p class="product-price">
                    100,000원
                  </p>

                </div>

              </div>

            </div>
            <!-- SLIDE 01 끝 -->



            <!-- =====================================
                 SLIDE 02
            ====================================== -->
            <div class="swiper-slide">

              <div class="product-card">

                <!-- 상품 이미지 -->
                <div class="product-image">

                  <img
                    src="./images/806200314b70c3db55fe169879156b15.jpg"
                    alt="자정미백코렉터"
                  >

                </div>


                <!-- 상품 정보 -->
                <div class="product-info">

                  <h3>자정미백코렉터</h3>

                  <p class="product-eng">
                    Luminous Discoloration Corrector
                  </p>

                  <p class="product-price">
                    150,000원
                  </p>

                </div>

              </div>

            </div>
            <!-- SLIDE 02 끝 -->



            <!-- =====================================
                 SLIDE 03
            ====================================== -->
            <div class="swiper-slide">

              <div class="product-card">

                <!-- 상품 이미지 -->
                <div class="product-image">

                  <img
                    src="./images/93d45903d086b3bdbf136d5030d2db77.jpg"
                    alt="퍼펙팅 쿠션 에어리"
                  >

                </div>


                <!-- 상품 정보 -->
                <div class="product-info">

                  <h3>퍼펙팅 쿠션 에어리</h3>

                  <p class="product-eng">
                    Perfecting Cushion Airy
                  </p>

                  <p class="product-price">
                    89,000원
                  </p>

                </div>

              </div>

            </div>
            <!-- SLIDE 03 끝 -->



            <!-- =====================================
                 SLIDE 04
            ====================================== -->
            <div class="swiper-slide">

              <div class="product-card">

                <!-- 상품 이미지 -->
                <div class="product-image">

                  <img
                    src="./images/b111ed2e55ac6569c4cabd99149143d2.jpg"
                    alt="윤조에센스"
                  >

                </div>


                <!-- 상품 정보 -->
                <div class="product-info">

                  <h3>윤조에센스</h3>

                  <p class="product-eng">
                    First Care Activating Serum
                  </p>

                  <p class="product-price">
                    140,000원
                  </p>

                </div>

              </div>

            </div>
            <!-- SLIDE 04 끝 -->



            <!-- =====================================
                 SLIDE 05
            ====================================== -->
            <div class="swiper-slide">

              <div class="product-card">

                <!-- 상품 이미지 -->
                <div class="product-image">

                  <img
                    src="./images/thumbnail_01_01.jpg"
                    alt="자음생크림"
                  >

                </div>


                <!-- 상품 정보 -->
                <div class="product-info">

                  <h3>자음생크림</h3>

                  <p class="product-eng">
                    Concentrated Ginseng Renewing Cream
                  </p>

                  <p class="product-price">
                    270,000원
                  </p>

                </div>

              </div>

            </div>
            <!-- SLIDE 05 끝 -->



            <!-- =====================================
                 SLIDE 06
            ====================================== -->
            <div class="swiper-slide">

              <div class="product-card">

                <!-- 상품 이미지 -->
                <div class="product-image">

                  <img
                    src="./images/thumbnail_01_02.jpg"
                    alt="진설아이크림"
                  >

                </div>


                <!-- 상품 정보 -->
                <div class="product-info">

                  <h3>진설아이크림</h3>

                  <p class="product-eng">
                    Ultimate S Eye Cream
                  </p>

                  <p class="product-price">
                    280,000원
                  </p>

                </div>

              </div>

            </div>
            <!-- SLIDE 06 끝 -->


          </div>
          <!-- Swiper Wrapper 끝 -->



          <!-- =========================================
               이전 버튼
               이미지는 직접 교체
          ========================================== -->
          <button
            type="button"
            class="swiper-button-prev custom-prev"
            aria-label="이전 상품"
          >

            <img
              src="./images/20210324-main-kv-arr-l.png"
              alt=""
            >

          </button>



          <!-- =========================================
               다음 버튼
               이미지는 직접 교체
          ========================================== -->
          <button
            type="button"
            class="swiper-button-next custom-next"
            aria-label="다음 상품"
          >

            <img
              src="./images/20210324-main-kv-arr-r.png"
              alt=""
            >

          </button>


        </div>
        <!-- Swiper 끝 -->



        <!-- =========================================
             하단 컨트롤 영역
        ========================================== -->
        <div class="slide-control">


          <!-- =========================================
               진행 막대
          ========================================== -->
          <div class="progress-wrap">

            <!-- 전체 진행선 -->
            <div class="progress-track">

              <!-- 현재 진행 상태 -->
              <div
                class="progress-bar"
                id="progressBar"
              ></div>

            </div>

          </div>



          <!-- =========================================
               일시정지 / 재생 버튼
          ========================================== -->
          <button
            type="button"
            class="play-control"
            id="playControl"
            aria-label="슬라이드 일시정지"
          >

            <!--
              기본 상태는 일시정지 이미지

              직접 교체할 이미지:
              ./images/btn_pause.png
              ./images/btn_play.png
            -->
            <img
              id="playControlImage"
              src="./images/pause.svg"
              alt="일시정지"
            >

          </button>


        </div>
        <!-- 하단 컨트롤 끝 -->


      </div>
      <!-- SLIDE SECTION 끝 -->


    </div>
    <!-- INNER 끝 -->


  </section>
  <!-- =========================================
       설화수 추천 SECTION 끝
  ========================================== -->



  <!-- =========================================
       Swiper JavaScript
  ========================================== -->
  <script
    src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"
  ></script>


  <!-- =========================================
       사용자 JavaScript
  ========================================== -->
  <script src="./js/script.js"></script>


</body>
</html>
