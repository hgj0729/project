<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>캠핑 장소 검색</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #ffffff;
      color: #111111;
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    }

    button {
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    img {
      display: block;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background: #ffffff;
    }

    /* 공통 화면 */
    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      transition:
        opacity 0.22s ease,
        visibility 0.22s ease;
    }

    .screen.is-hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    /* 상단 헤더 */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 80px;
      padding-top: env(safe-area-inset-top);
      border-bottom: 1px solid #eeeeee;
      background: #ffffff;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }

    .back-button {
      position: absolute;
      left: 24px;
      top: calc(50% + env(safe-area-inset-top) / 2);
      width: 24px;
      height: 24px;
      transform: translateY(-50%);
    }

    .back-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 검색 결과 목록 */
    .result-content {
      position: absolute;
      top: 80px;
      right: 0;
      bottom: 72px;
      left: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: #ffffff;
      scrollbar-width: none;
    }

    .result-content::-webkit-scrollbar {
      display: none;
    }

    .place-list {
      width: 100%;
      list-style: none;
    }

    .place-item {
      width: 100%;
      border-bottom: 1px solid #eeeeee;
    }

    .place-button {
      display: flex;
      align-items: flex-start;
      width: 100%;
      min-height: 148px;
      padding: 24px;
      text-align: left;
    }

    .place-thumbnail {
      flex: 0 0 100px;
      width: 100px;
      height: 100px;
      overflow: hidden;
      border-radius: 8px;
      background: #eeeeee;
    }

    .place-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .place-information {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      min-height: 100px;
      padding-left: 14px;
    }

    .place-name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .place-name {
      overflow: hidden;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bookmark-button {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
    }

    .bookmark-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .place-address {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.35;
      color: #222222;
    }

    .place-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
    }

    .place-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .place-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 25px;
      padding: 4px 10px;
      border-radius: 8px;
      background: #5575bd;
      color: #ffffff;
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
    }

    .place-distance {
      flex: 0 0 auto;
      color: #4e70be;
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* 하단 탭바 */
    .tab-bar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      display: flex;
      width: 100%;
      height: 72px;
      padding-bottom: env(safe-area-inset-bottom);
      border-top: 1px solid #eeeeee;
      background: #ffffff;
    }

    .tab-item {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #111111;
      font-size: 14px;
      font-weight: 600;
    }

    .tab-item img {
      width: 23px;
      height: 23px;
      object-fit: contain;
    }

    .tab-item.is-active {
      color: #4e70be;
    }

    /* 지도 화면 */
    .map-screen {
      background: #88d6e9;
    }

    .map-area {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      background: #d9eeee;
    }

    .map-back-button {
      position: absolute;
      top: calc(42px + env(safe-area-inset-top));
      left: 24px;
      z-index: 20;
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }

    .map-back-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .current-location-button {
      position: absolute;
      right: 24px;
      bottom: calc(166px + env(safe-area-inset-bottom));
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid #eeeeee;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.13);
    }

    .current-location-button img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    /* 지도 하단 선택 카드 */
    .selected-place-card {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      width: 100%;
      min-height: 148px;
      padding: 24px;
      background: #ffffff;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
    }

    .selected-thumbnail {
      flex: 0 0 100px;
      width: 100px;
      height: 100px;
      overflow: hidden;
      border-radius: 8px;
      background: #eeeeee;
    }

    .selected-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .selected-information {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      min-height: 100px;
      padding-left: 14px;
    }

    .selected-name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .selected-name {
      overflow: hidden;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .selected-bookmark {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
    }

    .selected-bookmark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .selected-address {
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.4;
    }

    .selected-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
    }

    .selected-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .selected-distance {
      color: #4e70be;
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* 카카오 지도 커스텀 오버레이 */
    .map-label {
      position: relative;
      transform: translateY(-10px);
      padding: 7px 11px;
      border-radius: 18px;
      background: #ffffff;
      color: #1b1b1b;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.2);
    }

    .map-label::after {
      position: absolute;
      bottom: -6px;
      left: 50%;
      width: 12px;
      height: 12px;
      background: #ffffff;
      content: "";
      transform: translateX(-50%) rotate(45deg);
    }

    /* 로딩 및 오류 안내 */
    .map-message {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 5;
      width: calc(100% - 48px);
      padding: 18px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.94);
      color: #333333;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .map-message.is-hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="app">
    <!-- 검색 결과 화면 -->
    <section
      id="resultScreen"
      class="screen"
      aria-label="캠핑 장소 검색 결과"
    >
      <header class="header">
        <button
          type="button"
          class="back-button"
          aria-label="이전 화면"
          onclick="history.back()"
        >
          <img src="./images/arrow.svg" alt="뒤로가기">
        </button>

        <h1 class="header-title">검색결과</h1>
      </header>

      <div class="result-content">
        <ul id="placeList" class="place-list"></ul>
      </div>

      <nav class="tab-bar" aria-label="하단 메뉴">
        <button type="button" class="tab-item">
          <img src="./images/home.svg" alt="홈">
          <span>홈</span>
        </button>

        <button type="button" class="tab-item is-active">
          <img src="./images/search.svg" alt="검색">
          <span>검색</span>
        </button>

        <button type="button" class="tab-item">
          <img src="./images/community.svg" alt="모임">
          <span>모임</span>
        </button>

        <button type="button" class="tab-item">
          <img src="./images/live.svg" alt="라이브">
          <span>LIVE</span>
        </button>

        <button type="button" class="tab-item">
          <img src="./images/user.svg" alt="사용자">
          <span>MY</span>
        </button>
      </nav>
    </section>

    <!-- 지도 상세 화면 -->
    <section
      id="mapScreen"
      class="screen map-screen is-hidden"
      aria-label="선택한 캠핑 장소 지도"
    >
      <div id="map" class="map-area"></div>

      <p id="mapMessage" class="map-message">
        지도를 불러오는 중입니다.
      </p>

      <button
        id="mapBackButton"
        type="button"
        class="map-back-button"
        aria-label="검색 결과로 돌아가기"
      >
        <img src="./images/arrow.svg" alt="뒤로가기">
      </button>

      <button
        id="currentLocationButton"
        type="button"
        class="current-location-button"
        aria-label="현재 위치 보기"
      >
        <img src="./images/icon-current-location.png" alt="">
      </button>

      <article class="selected-place-card">
        <div class="selected-thumbnail">
          <img
            id="selectedImage"
            src="./images/camping01.jpg"
            alt="선택한 캠핑 장소"
          >
        </div>

        <div class="selected-information">
          <div class="selected-name-row">
            <h2 id="selectedName" class="selected-name">
              망원한강공원
            </h2>

            <button
              id="selectedBookmarkButton"
              type="button"
              class="selected-bookmark"
              aria-label="즐겨찾기"
            >
              <img
                id="selectedBookmarkImage"
                src="./images/icons.svg"
                alt=""
              >
            </button>
          </div>

          <p id="selectedAddress" class="selected-address">
            서울 마포구 망원동 205-4
          </p>

          <div class="selected-bottom">
            <div id="selectedTags" class="selected-tags"></div>
            <strong id="selectedDistance" class="selected-distance">
              11.1km
            </strong>
          </div>
        </div>
      </article>
    </section>
  </main>

  <!--
    YOUR_JAVASCRIPT_KEY 부분을
    카카오 개발자 사이트에서 발급받은 JavaScript 키로 변경하세요.
  -->
  <script
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=df248d44c279e1becb804df0b4f68a1d&autoload=false"
  ></script>

  <script>
    const places = [
      {
        id: 1,
        name: "망원한강공원",
        address: "서울 마포구 망원동 205-4",
        tags: ["차크닉", "주차장"],
        distance: "11.1km",
        image: "./images/main.png",
        latitude: 37.5524,
        longitude: 126.8991
      },
      {
        id: 2,
        name: "광교호수공원",
        address: "경기 수원시 영통구 광교호수로 165",
        tags: ["도심", "주차장"],
        distance: "26km",
        image: "./images/main-1.png",
        latitude: 37.2838,
        longitude: 127.0651
      },
      {
        id: 3,
        name: "강릉 안반데기",
        address: "강원 강릉시 왕산면 안반데기길",
        tags: ["오션뷰", "주차장"],
        distance: "108km",
        image: "./images/main-2.png",
        latitude: 37.6211,
        longitude: 128.7372
      },
      {
        id: 4,
        name: "화성 궁평항",
        address: "경기도 화성시 서신면 궁평항로 1049-24",
        tags: ["차크닉", "주차장"],
        distance: "58km",
        image: "./images/main-3.png",
        latitude: 37.1174,
        longitude: 126.6826
      },
      {
        id: 5,
        name: "서귀포 돈내코",
        address: "제주특별자치도 서귀포시 돈내코로 114",
        tags: ["이색", "주차장"],
        distance: "483km",
        image: "./images/main-4.png",
        latitude: 33.3004,
        longitude: 126.5852
      },
      {
        id: 6,
        name: "영종도 마시안해변",
        address: "인천 중구 마시란로 118",
        tags: ["수도권", "주차장"],
        distance: "32km",
        image: "./images/main-5.png",
        latitude: 37.4372,
        longitude: 126.4175
      }
    ];

    const resultScreen = document.getElementById("resultScreen");
    const mapScreen = document.getElementById("mapScreen");
    const placeList = document.getElementById("placeList");
    const mapMessage = document.getElementById("mapMessage");

    const selectedImage = document.getElementById("selectedImage");
    const selectedName = document.getElementById("selectedName");
    const selectedAddress = document.getElementById("selectedAddress");
    const selectedTags = document.getElementById("selectedTags");
    const selectedDistance = document.getElementById("selectedDistance");

    let selectedPlace = places[0];
    let kakaoMap = null;
    let placeMarker = null;
    let placeOverlay = null;
    let currentLocationMarker = null;
    let isMapLoaded = false;

    function createTag(tagText) {
      const tag = document.createElement("span");
      tag.className = "place-tag";
      tag.textContent = tagText;
      return tag;
    }

    function renderPlaceList() {
      placeList.innerHTML = "";

      places.forEach((place) => {
        const listItem = document.createElement("li");
        listItem.className = "place-item";

        const placeButton = document.createElement("button");
        placeButton.type = "button";
        placeButton.className = "place-button";
        placeButton.setAttribute(
          "aria-label",
          `${place.name} 지도에서 보기`
        );

        const thumbnail = document.createElement("div");
        thumbnail.className = "place-thumbnail";

        const thumbnailImage = document.createElement("img");
        thumbnailImage.src = place.image;
        thumbnailImage.alt = `${place.name} 이미지`;

        thumbnail.appendChild(thumbnailImage);

        const information = document.createElement("div");
        information.className = "place-information";

        const nameRow = document.createElement("div");
        nameRow.className = "place-name-row";

        const name = document.createElement("h2");
        name.className = "place-name";
        name.textContent = place.name;

        const bookmarkButton = document.createElement("button");
        bookmarkButton.type = "button";
        bookmarkButton.className = "bookmark-button";
        bookmarkButton.setAttribute("aria-label", `${place.name} 즐겨찾기`);

        const bookmarkImage = document.createElement("img");
        bookmarkImage.src = "./images/icons.svg";
        bookmarkImage.alt = "";

        bookmarkButton.appendChild(bookmarkImage);

        bookmarkButton.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleBookmark(bookmarkButton);
        });

        nameRow.appendChild(name);
        nameRow.appendChild(bookmarkButton);

        const address = document.createElement("p");
        address.className = "place-address";
        address.textContent = place.address;

        const bottom = document.createElement("div");
        bottom.className = "place-bottom";

        const tags = document.createElement("div");
        tags.className = "place-tags";

        place.tags.forEach((tagText) => {
          tags.appendChild(createTag(tagText));
        });

        const distance = document.createElement("strong");
        distance.className = "place-distance";
        distance.textContent = place.distance;

        bottom.appendChild(tags);
        bottom.appendChild(distance);

        information.appendChild(nameRow);
        information.appendChild(address);
        information.appendChild(bottom);

        placeButton.appendChild(thumbnail);
        placeButton.appendChild(information);

        placeButton.addEventListener("click", () => {
          openMapScreen(place);
        });

        listItem.appendChild(placeButton);
        placeList.appendChild(listItem);
      });
    }

    function toggleBookmark(button) {
      const image = button.querySelector("img");
      const active = button.dataset.active === "true";

      button.dataset.active = String(!active);
      image.src = active
        ? "./images/icon-bookmark.png"
        : "./images/icon-bookmark-active.png";
    }

    function updateSelectedCard(place) {
      selectedImage.src = place.image;
      selectedImage.alt = `${place.name} 이미지`;
      selectedName.textContent = place.name;
      selectedAddress.textContent = place.address;
      selectedDistance.textContent = place.distance;

      selectedTags.innerHTML = "";

      place.tags.forEach((tagText) => {
        selectedTags.appendChild(createTag(tagText));
      });
    }

    function openMapScreen(place) {
      selectedPlace = place;
      updateSelectedCard(place);

      resultScreen.classList.add("is-hidden");
      mapScreen.classList.remove("is-hidden");

      history.pushState(
        { screen: "map", placeId: place.id },
        "",
        `#place-${place.id}`
      );

      loadKakaoMap();
    }

    function closeMapScreen(useHistoryBack = true) {
      mapScreen.classList.add("is-hidden");
      resultScreen.classList.remove("is-hidden");

      if (useHistoryBack && location.hash.startsWith("#place-")) {
        history.back();
      }
    }

    function loadKakaoMap() {
      if (
        typeof window.kakao === "undefined" ||
        typeof window.kakao.maps === "undefined"
      ) {
        mapMessage.classList.remove("is-hidden");
        mapMessage.innerHTML =
          "카카오 지도 API를 불러오지 못했습니다.<br>" +
          "JavaScript API 키와 등록 도메인을 확인해주세요.";
        return;
      }

      mapMessage.classList.remove("is-hidden");
      mapMessage.textContent = "지도를 불러오는 중입니다.";

      kakao.maps.load(() => {
        if (!isMapLoaded) {
          initializeMap();
          isMapLoaded = true;
        }

        moveMapToPlace(selectedPlace);

        window.setTimeout(() => {
          kakaoMap.relayout();
          moveMapToPlace(selectedPlace);
          mapMessage.classList.add("is-hidden");
        }, 100);
      });
    }

    function initializeMap() {
      const mapContainer = document.getElementById("map");

      const mapOptions = {
        center: new kakao.maps.LatLng(
          selectedPlace.latitude,
          selectedPlace.longitude
        ),
        level: 4
      };

      kakaoMap = new kakao.maps.Map(mapContainer, mapOptions);

      kakaoMap.setZoomable(true);
      kakaoMap.setDraggable(true);
    }

    function moveMapToPlace(place) {
      if (!kakaoMap) {
        return;
      }

      const position = new kakao.maps.LatLng(
        place.latitude,
        place.longitude
      );

      kakaoMap.setCenter(position);
      kakaoMap.setLevel(4);

      if (placeMarker) {
        placeMarker.setMap(null);
      }

      if (placeOverlay) {
        placeOverlay.setMap(null);
      }

      placeMarker = new kakao.maps.Marker({
        position: position
      });

      placeMarker.setMap(kakaoMap);

      const overlayContent = document.createElement("div");
      overlayContent.className = "map-label";
      overlayContent.textContent = place.name;

      placeOverlay = new kakao.maps.CustomOverlay({
        position: position,
        content: overlayContent,
        yAnchor: 2.4
      });

      placeOverlay.setMap(kakaoMap);
    }

    function moveToCurrentLocation() {
      if (!navigator.geolocation) {
        alert("현재 위치 기능을 지원하지 않는 환경입니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          if (!kakaoMap) {
            return;
          }

          const currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          kakaoMap.panTo(currentPosition);

          if (currentLocationMarker) {
            currentLocationMarker.setMap(null);
          }

          currentLocationMarker = new kakao.maps.Marker({
            position: currentPosition
          });

          currentLocationMarker.setMap(kakaoMap);
        },
        () => {
          alert("현재 위치를 확인할 수 없습니다. 위치 권한을 확인해주세요.");
        },
        {
          enableHighAccuracy: true,
          timeout: 8000,
          maximumAge: 30000
        }
      );
    }

    document
      .getElementById("mapBackButton")
      .addEventListener("click", () => {
        closeMapScreen(true);
      });

    document
      .getElementById("currentLocationButton")
      .addEventListener("click", moveToCurrentLocation);

    document
      .getElementById("selectedBookmarkButton")
      .addEventListener("click", (event) => {
        toggleBookmark(event.currentTarget);
      });

    window.addEventListener("popstate", () => {
      if (!location.hash.startsWith("#place-")) {
        mapScreen.classList.add("is-hidden");
        resultScreen.classList.remove("is-hidden");
      }
    });

    renderPlaceList();
  </script>
</body>
</html>
