<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, "Noto Sans KR", sans-serif;
  color: #333;
  background-color: #fff;
}

.login-wrap {
  width: 746px;
  min-height: 560px;
  margin: 0 auto;
  padding-top: 43px;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.login-wrap h1 {
  margin-bottom: 34px;
  text-align: center;
  font-size: 44px;
  font-weight: 700;
  line-height: 1.2;
  color: #505050;
}

.login-form {
  width: 421px;
  margin: 0 auto;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 9px;
  font-size: 20px;
  font-weight: 400;
  color: #333;
}

.form-group input {
  display: block;
  width: 100%;
  height: 68px;
  padding: 0 15px;
  border: 1px solid #ccc;
  background-color: #fff;
  font-size: 18px;
  outline: none;
}

.form-group input:focus {
  border-color: #777;
}

.login-form button {
  width: 100%;
  height: 64px;
  margin-top: 7px;
  border: 0;
  background-color: #2d2d2d;
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}

.login-form button:hover {
  background-color: #222;
}
  </style>
</head>
<body>

  <div class="login-wrap">
    <h1>로그인</h1>

    <form class="login-form">
      <div class="form-group">
        <label for="user-id">아이디</label>
        <input type="text" id="user-id">
      </div>

      <div class="form-group">
        <label for="user-password">비밀번호</label>
        <input type="password" id="user-password">
      </div>

      <button type="submit">로그인</button>
    </form>
  </div>

</body>
</html>
