<!DOCTYPE html>

<title>진달래 꽃</title>

<style>

h1{
    text-align:center;
}

h2{
    text-align:right;
}

p{
    text-align:center;
}

</style>

</head>

<body>

<h1>진달래 꽃</h1>

<h2>지은이 : 김소월</h2>

<p>
나 보기가<br>
역겨워<br>
가실 때에는
</p>

<p>
말 없이<br>
고이<br>
보내 드리오리다
</p>

<p>
영변에<br>
약산<br>
진달래 꽃
</p>

<p>
진달래<br>
진달래 꽃<br>
피었네
</p>

</body>
