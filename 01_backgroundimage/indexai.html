<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Outback Banner</title>
  <link rel="stylesheet" href="./css/styleai.css">
</head>
<body>

  <section class="quick-banner">
    <div class="inner">

      <!-- RESERVE -->
      <div class="banner reserve">
        <div class="text-box">
          <h2>RESERVE</h2>
          <p>예약하기</p>

          <span class="arrow">⟶</span>
        </div>

        <div class="banner-image reserve-image"></div>
      </div>

      <!-- SAVE POINT -->
      <div class="banner point">
        <div class="text-box">
          <h2>SAVE POINT</h2>
          <p>사후 적립</p>

          <span class="arrow">⟶</span>
        </div>

        <div class="banner-image point-image"></div>
      </div>

      <!-- DELIVERY -->
      <div class="banner delivery">
        <div class="text-box">
          <h2>DELIVERY</h2>
          <p>딜리버리</p>

          <span class="arrow">⟶</span>
        </div>

        <div class="banner-image delivery-image"></div>
      </div>

    </div>
  </section>

</body>
</html>
