<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>WASHGO Main Banner</title>

    <!-- Swiper CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- 사용자 CSS -->
    <link
        rel="stylesheet"
        href="./css/style.css">
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <button
            type="button"
            class="header-button"
            aria-label="메뉴 열기">

            <img
                src="./images/hamburger.svg"
                alt="메뉴">

        </button>


        <a
            href="./index.html"
            class="logo">

            <img
                src="./images/logo 4.svg"
                alt="WASHGO">

        </a>


        <button
            type="button"
            class="header-button"
            aria-label="알림">

            <img
                src="./images/bell.svg"
                alt="알림">

        </button>

    </header>


    <!-- Main Banner -->
    <main class="main-content">

        <section class="banner-section">

            <div class="swiper main-swiper">

                <div class="swiper-wrapper">


                    <!-- Slide 1 -->
                    <div class="swiper-slide">

                        <img
                            src="./images/baner1.png"
                            alt="워시고 메인 배너 1"
                            class="banner-image">

                    </div>


                    <!-- Slide 2 -->
                    <div class="swiper-slide">

                        <img
                            src="./images/baner2.png"
                            alt="워시고 메인 배너 2"
                            class="banner-image">

                    </div>


                    <!-- Slide 3 -->
                    <div class="swiper-slide">

                        <img
                            src="./images/baner3.png"
                            alt="워시고 메인 배너 3"
                            class="banner-image">

                    </div>


                </div>


                <!-- 좌우 버튼 -->
                <button
                    type="button"
                    class="swiper-button-prev"
                    aria-label="이전 슬라이드">
                </button>

                <button
                    type="button"
                    class="swiper-button-next"
                    aria-label="다음 슬라이드">
                </button>

            </div>


            <!-- 페이지네이션 -->
            <div class="swiper-pagination"></div>

        </section>

    </main>

</div>


<!-- Swiper JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<!-- 사용자 JavaScript -->
<script src="./js/script.js"></script>

</body>

</html>
