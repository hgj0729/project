<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WASHGO Splash</title>

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

html,
body{

    width:100%;
    height:100%;

    font-family:Pretendard,sans-serif;

    background:#2D7FF9;

}

/* 모바일 앱 */

.app{

    width:100%;
    height:100vh;

    position:relative;

    overflow:hidden;

    background:#2D7FF9;

}


/* 중앙 영역 */

.contents{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-58%);

    width:100%;

    text-align:center;

}


/* 로고 */

.logo{

    width:88px;

    display:block;

    margin:0 auto 34px;

}


/* 앱명 */

.title{

    font-size:64px;

    font-weight:800;

    color:#FFFFFF;

    line-height:1;

    letter-spacing:-2px;

}


/* 슬로건 */

.sub-title{

    margin-top:24px;

    font-size:22px;

    font-weight:700;

    color:#FFFFFF;

    line-height:1.4;

}


/* 왼쪽 하단 원 */

.circle-left{

    position:absolute;

    left:52px;

    bottom:98px;

    width:50px;

    height:50px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.18);

}


/* 오른쪽 원 */

.circle-right{

    position:absolute;

    right:22px;

    bottom:152px;

    width:48px;

    height:48px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.18);

}


/* 웨이브 */

.wave{

    position:absolute;

    left:-8%;

    bottom:-35px;

    width:120%;

    height:150px;

    border-radius:50%;

    border-top:1px solid rgba(255,255,255,.10);

    background:rgba(255,255,255,.03);

}

</style>

</head>

<body>

<div class="app">

    <div class="contents">

        <img
            src="./icons/logo 4.svg"
            alt="WASHGO Logo"
            class="logo">

        <h1 class="title">

            WASHER

        </h1>

        <p class="sub-title">

            더 편리한 빨래의 시작

        </p>

    </div>


    <div class="circle-left"></div>

    <div class="circle-right"></div>

    <div class="wave"></div>

</div>
<script>

window.addEventListener("load", function () {

    setTimeout(function () {

        window.location.href = "onboard1.html";

    }, 3000);

});

</script>
</body>

</html>
