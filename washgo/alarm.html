<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>세탁 진행 현황</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#FFFFFF;
    color:#171B24;
    font-family:Pretendard, Arial, sans-serif;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    padding:0;
    border:0;
    background:none;
    font:inherit;
    cursor:pointer;
}

img{
    display:block;
}


/* 모바일 앱 전체 영역 */

.app{

    width:100%;
    height:100svh;

    position:relative;

    overflow:hidden;

    background:#FFFFFF;

}


/* 세로 스크롤 영역 */

.scroll-area{

    width:100%;
    height:100%;

    overflow-x:hidden;
    overflow-y:auto;

    padding-bottom:92px;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;

}

.scroll-area::-webkit-scrollbar{

    display:none;

}


/* 본문 */

.content{

    padding:76px 20px 40px;

}


/* 화면 제목 */

.page-title{

    text-align:center;

    color:#171B24;

    font-size:27px;

    font-weight:700;

    line-height:1.4;

    letter-spacing:-0.7px;

}


/* 매장 및 기기 카드 */

.machine-card{

    min-height:110px;

    margin-top:34px;

    padding:18px 15px;

    display:flex;

    align-items:center;

    gap:13px;

    border:1px solid #D5DAE2;

    border-radius:17px;

    background:#FFFFFF;

}

.machine-thumbnail{

    width:72px;
    height:72px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:8px;

    background:#DDDDDD;

}

.machine-thumbnail img{

    width:42px;
    height:42px;

    object-fit:contain;

}

.machine-information{

    flex:1;

    min-width:0;

}

.store-name{

    color:#1D222C;

    font-size:17px;

    font-weight:700;

    line-height:1.4;

}

.machine-name{

    margin-top:7px;

    color:#788291;

    font-size:15px;

    font-weight:400;

    line-height:1.4;

}


/* 진행률 영역 */

.progress-section{

    margin-top:50px;

    display:flex;

    flex-direction:column;

    align-items:center;

}


/* 원형 진행률 */

.progress-ring{

    width:188px;
    height:188px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:
        conic-gradient(
            #2D6BF2 0deg,
            #2D6BF2 216deg,
            #F3F5F8 216deg,
            #F3F5F8 360deg
        );

}

.progress-ring::before{

    content:"";

    width:150px;
    height:150px;

    position:absolute;

    border-radius:50%;

    background:#FFFFFF;

}

.progress-value{

    position:relative;

    z-index:1;

    display:flex;

    align-items:flex-end;

    color:#101C37;

    font-size:42px;

    font-weight:800;

    line-height:1;

}

.progress-value span{

    margin-bottom:3px;

    font-size:23px;

    font-weight:700;

}


/* 진행 정보 */

.progress-information{

    margin-top:58px;

    text-align:center;

}

.remaining-time{

    color:#171B24;

    font-size:20px;

    font-weight:700;

    line-height:1.4;

}

.expected-time{

    margin-top:16px;

    color:#171B24;

    font-size:19px;

    font-weight:700;

    line-height:1.4;

}


/* 알림 설정 */

.notification-setting{

    margin-top:34px;

}

.notification-button{

    width:100%;
    height:52px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:1px solid #D5DAE2;

    border-radius:14px;

    background:#FFFFFF;

    color:#171B24;

    font-size:16px;

    font-weight:700;

}

.notification-button:active{

    background:#F5F6F8;

}


/* 공통 하단 탭바 */

.bottom-navigation{

    width:100%;
    height:78px;

    position:absolute;

    left:0;
    bottom:0;

    z-index:30;

    display:grid;

    grid-template-columns:repeat(4, 1fr);

    border-top:1px solid #D9DCE2;

    background:#FFFFFF;

}

.nav-item{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:6px;

    color:#7A8391;

    font-size:11px;

    font-weight:500;

}

.nav-item img{

    width:23px;
    height:23px;

    object-fit:contain;

}

.nav-item.active{

    color:#2D7FF9;

}

.nav-item.active span{

    font-weight:700;

}

</style>

</head>

<body>

<div class="app">


    <main class="scroll-area">

        <section class="content">


            <!-- 화면 제목 -->
            <h1 class="page-title">

                세탁 진행 현황

            </h1>


            <!-- 매장 및 기기 정보 -->
            <article class="machine-card">

                <div class="machine-thumbnail">

                    <img
                        src="./images/user.png"
                        alt="워셔타운 강남점">

                </div>

                <div class="machine-information">

                    <h2 class="store-name">
                        워셔타운 강남점
                    </h2>

                    <p class="machine-name">
                        세탁기 2 (27kg)
                    </p>

                </div>

            </article>


            <!-- 진행률 -->
            <section class="progress-section">

                <div
                    class="progress-ring"
                    role="progressbar"
                    aria-label="세탁 진행률"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="60">

                    <div class="progress-value">

                        60<span>%</span>

                    </div>

                </div>


                <!-- 남은 시간 -->
                <div class="progress-information">

                    <p class="remaining-time">

                        남은 시간 18분

                    </p>

                    <p class="expected-time">

                        예상 종료 11:18

                    </p>

                </div>

            </section>


            <!-- 종료 알림 설정 -->
            <div class="notification-setting">

                <button
                    type="button"
                    class="notification-button">

                    종료 알림 설정

                </button>

            </div>

        </section>

    </main>


    <!-- 공통 하단 탭바 -->
    <nav class="bottom-navigation">

        <a
            href="./home.html"
            class="nav-item">

            <img
                src="./icons/homeblack.svg"
                alt="">

            <span>
                홈
            </span>

        </a>


        <a
            href="./storelist.html"
            class="nav-item">

            <img
                src="./icons/search.svg"
                alt="">

            <span>
                매장찾기
            </span>

        </a>


        <a
            href="./alarm.html"
            class="nav-item active">

            <img
                src="./icons/bluebell.svg"
                alt="">

            <span>
                알림
            </span>

        </a>


        <a
            href="./mypage.html"
            class="nav-item">

            <img
                src="./icons/person.svg"
                alt="">

            <span>
                마이페이지
            </span>

        </a>

    </nav>

</div>

</body>

</html>
