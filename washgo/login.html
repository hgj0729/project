<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WASHGO Login</title>

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    font-family:Pretendard,sans-serif;
    background:#FFFFFF;
    color:#1C1E21;

}

/* 모바일 전용 */

.app{

    width:100%;
    min-height:100vh;
    background:#FFFFFF;
    padding:72px 20px 40px;

}

/* 제목 */

.title{

    margin-bottom:42px;

}

.title h1{

    font-size:28px;
    font-weight:700;
    line-height:1.3;
    color:#1C1E21;

}

.title p{

    margin-top:14px;

    font-size:18px;
    font-weight:600;
    color:#1C1E21;

}

/* 입력 */

.form{

    margin-bottom:42px;

}

.input{

    width:100%;
    height:54px;

    padding:0 18px;

    border:1px solid #D9DCE2;
    border-radius:18px;

    outline:none;

    font-size:16px;

    color:#1C1E21;

    margin-bottom:12px;

    background:#FFFFFF;

}

.input::placeholder{

    color:#8B95A1;

}

/* 옵션 */

.option{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;

}

.auto{

    display:flex;

    align-items:center;

    gap:10px;

}

.circle{

    width:24px;
    height:24px;

    border-radius:50%;

    background:#D8E7FF;

}

.auto span{

    font-size:16px;

    color:#1C1E21;

}

.find{

    font-size:15px;

    color:#7E8695;

    text-decoration:none;

}

/* 로그인 버튼 */

.login-btn{

    width:100%;
    height:54px;

    border:none;

    border-radius:16px;

    background:#2D7FF9;

    color:#FFFFFF;

    font-size:18px;

    font-weight:600;

    cursor:pointer;

}

.login-btn:active{

    background:#5B9CFA;

}

/* 구분선 */

.divider{

    display:flex;

    align-items:center;

    gap:16px;

    margin:28px 0;

}

.line{

    flex:1;

    height:1px;

    background:#D9DCE2;

}

.divider span{

    font-size:16px;

    color:#7E8695;

}

/* SNS */

.sns{

    display:flex;

    flex-direction:column;

    gap:14px;

}

.sns-btn{

    width:100%;

    height:54px;

    border:1px solid #D9DCE2;

    border-radius:16px;

    background:#FFFFFF;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    cursor:pointer;

}

.left{

    display:flex;

    align-items:center;

    gap:14px;

}

.left img{

    width:24px;

}

.left span{

    font-size:18px;

    color:#1C1E21;

}

.arrow{

    width:12px;

}

/* 하단 */

.bottom{

    margin-top:32px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:30px;

}

.bottom a{

    text-decoration:none;

    color:#7E8695;

    font-size:16px;

    font-weight:500;

}

.bar{

    width:1px;

    height:18px;

    background:#8B95A1;

}
/* 입력폼 */

.form{

    margin-bottom:42px;

}

/* 라벨 */

.label{

    display:block;

    margin-bottom:8px;

    margin-left:4px;

    font-size:14px;

    font-weight:600;

    color:#5E6672;

}

/* 입력창 */

.input{

    width:100%;

    height:54px;

    padding:0 18px;

    margin-bottom:20px;

    border:1px solid #D9DCE2;

    border-radius:16px;

    background:#FFFFFF;

    outline:none;

    font-size:16px;

    color:#1C1E21;

    transition:.2s;

}

.input::placeholder{

    color:#8B95A1;

}

.input:focus{

    border:2px solid #2D7FF9;

}
</style>

</head>

<body>

<div class="app">

    <div class="title">

        <h1>

            환영합니다!

        </h1>

        <p>

            워셔에 오신 것을 환영해요

        </p>

    </div>

<div class="form">

    <label class="label">

        아이디

    </label>

    <input
        class="input"
        type="email"
        placeholder="이메일 주소를 입력하세요">

    <label class="label">

        비밀번호

    </label>

    <input
        class="input"
        type="password"
        placeholder="비밀번호를 입력하세요">

</div>

    


    <div class="option">

        <div class="auto">

            <div class="circle"></div>

            <span>자동 로그인</span>

        </div>

        <a href="#" class="find">

            비밀번호 찾기

        </a>

    </div>


    <button
    type="button"
    class="login-btn"
    onclick="location.href='./home.html'">

    로그인

</button>


    <div class="divider">

        <div class="line"></div>

        <span>또는</span>

        <div class="line"></div>

    </div>


    <div class="sns">

        <button class="sns-btn">

            <div class="left">

                <img src="./icons/kakao.svg" alt="카카오">

                <span>카카오 로그인</span>

            </div>

            <img class="arrow" src="./icons/next.svg" alt="arrow">

        </button>


        <button class="sns-btn">

            <div class="left">

                <img src="./icons/naver.svg" alt="네이버">

                <span>네이버 로그인</span>

            </div>

            <img class="arrow" src="./icons/next.svg" alt="arrow">

        </button>


        <button class="sns-btn">

            <div class="left">

                <img src="./icons/google.svg" alt="구글">

                <span>구글 로그인</span>

            </div>

            <img class="arrow" src="./icons/next.svg" alt="arrow">

        </button>

    </div>


    <div class="bottom">

        <a href="#">회원가입</a>

        <div class="bar"></div>

        <a href="#">비회원으로 둘러보기</a>

    </div>

</div>

</body>

</html>
