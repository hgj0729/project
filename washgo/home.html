<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>WASHGO Home</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#FFFFFF;
    font-family:Pretendard, Arial, sans-serif;
    color:#1C1E21;
}

body{
    min-width:320px;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font:inherit;
}

button{
    padding:0;
    border:0;
    background:none;
    cursor:pointer;
}

img{
    display:block;
}


/* =========================
   모바일 앱 전체 영역
========================= */

.app{

    width:100%;
    height:100svh;

    position:relative;

    overflow:hidden;

    background:#FFFFFF;

}


/* =========================
   세로 스크롤 영역
========================= */

.scroll-area{

    width:100%;
    height:100%;

    overflow-x:hidden;
    overflow-y:auto;

    padding-bottom:78px;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;

}

.scroll-area::-webkit-scrollbar{

    display:none;

}


/* =========================
   상단 헤더
========================= */

.header{

    padding:30px 20px 0;

}

.location-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.location-box{

    display:flex;

    align-items:center;

    gap:12px;

}

.location-icon{

    width:18px;
    height:22px;

    object-fit:contain;

}

.location-text{

    color:#111318;

    font-size:17px;

    font-weight:700;

    line-height:1.4;

}

.notification-button{

    width:28px;
    height:28px;

    display:flex;

    align-items:center;

    justify-content:center;

}

.notification-button img{

    width:22px;
    height:22px;

    object-fit:contain;

}


/* =========================
   검색창
========================= */

.search-section{

    margin-top:85px;

}

.search-box{

    width:100%;
    height:45px;

    padding:0 18px;

    display:flex;

    align-items:center;

    gap:14px;

    border:1px solid #D5DAE2;

    border-radius:14px;

    background:#FFFFFF;

}

.search-box img{

    width:18px;
    height:18px;

    object-fit:contain;

}

.search-box input{

    flex:1;

    min-width:0;
    height:100%;

    border:0;
    outline:none;

    background:transparent;

    color:#1C1E21;

    font-size:15px;

}

.search-box input::placeholder{

    color:#8B95A1;

}


/* =========================
   쿠폰 배너
========================= */

.coupon-banner{

    height:115px;

    margin-top:31px;

    padding:0 34px 0 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-radius:15px;

    background:#DCE9FB;

}

.coupon-title{

    color:#151922;

    font-size:18px;

    font-weight:700;

    line-height:1.4;

}

.coupon-description{

    margin-top:3px;

    color:#7C8593;

    font-size:15px;

    font-weight:400;

}

.coupon-image{

    width:58px;
    height:43px;

    object-fit:contain;

}


/* =========================
   공통 섹션
========================= */

.section{

    margin-top:32px;

}

.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.section-title{

    color:#111318;

    font-size:21px;

    font-weight:700;

    line-height:1.4;

}

.more-link{

    display:flex;

    align-items:center;

    gap:9px;

    color:#737B89;

    font-size:18px;

    font-weight:600;

}

.more-link img{

    width:11px;
    height:19px;

    object-fit:contain;

}


/* =========================
   추천 매장 카드
========================= */

.store-card{

    min-height:111px;

    margin-top:33px;

    padding:17px 16px 17px 15px;

    display:flex;

    align-items:flex-start;

    gap:13px;

    border:1px solid #D5DAE2;

    border-radius:17px;

    background:#FFFFFF;

}

.store-thumbnail{

    width:72px;
    height:72px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:8px;

    background:#DDDDDD;

}

.store-thumbnail img{

    width:42px;
    height:42px;

    object-fit:contain;

}

.store-content{

    flex:1;

    min-width:0;

}

.store-title-row{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:12px;

}

.store-name{

    color:#1D222C;

    font-size:17px;

    font-weight:700;

    line-height:1.4;

}

.favorite-button{

    width:26px;
    height:26px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

}

.favorite-button img{

    width:22px;
    height:22px;

    object-fit:contain;

}

.store-meta{

    margin-top:6px;

    display:flex;

    align-items:center;

    gap:10px;

    color:#788291;

    font-size:15px;

}

.store-status{

    margin-top:8px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    color:#788291;

    font-size:15px;

}

.available-count{

    color:#22C77A;

    font-weight:600;

}

.congestion-normal{

    color:#FF9F0A;

    font-weight:600;

}


/* =========================
   최근 이용 매장
========================= */

.recent-card{

    min-height:111px;

    margin-top:20px;

    padding:17px 15px;

    display:flex;

    align-items:center;

    gap:13px;

    border:1px solid #D5DAE2;

    border-radius:17px;

    background:#FFFFFF;

}

.recent-content{

    flex:1;

}

.recent-store-name{

    color:#1D222C;

    font-size:17px;

    font-weight:700;

    line-height:1.4;

}

.recent-date{

    margin-top:8px;

    color:#788291;

    font-size:15px;

}


/* =========================
   하단 내비게이션
========================= */

.bottom-navigation{

    width:100%;
    height:78px;

    position:absolute;

    left:0;
    bottom:0;

    z-index:20;

    display:grid;

    grid-template-columns:repeat(4, 1fr);

    border-top:1px solid #D9DCE2;

    background:#FFFFFF;

}

.nav-item{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:6px;

    color:#77808E;

    font-size:11px;

    font-weight:500;

}

.nav-item img{

    width:23px;
    height:23px;

    object-fit:contain;

}

.nav-item.active{

    color:#2D7FF9;

}

.nav-item.active span{

    font-weight:700;

}

</style>

</head>

<body>

<div class="app">

    <main class="scroll-area">

        <div class="header">

            <!-- 위치와 알림 -->
            <div class="location-row">

                <div class="location-box">

                    <img
                        src="./icons/place.svg"
                        alt="현재 위치"
                        class="location-icon">

                    <span class="location-text">
                        서울 강남구 역삼동
                    </span>

                </div>

                <button
                    type="button"
                    class="notification-button"
                    aria-label="알림">

                    <img
                        src="./icons/bell.svg"
                        alt="">

                </button>

            </div>


            <!-- 검색창 -->
            <div class="search-section">

                <label class="search-box">

                    <img
                        src="./icons/search.svg"
                        alt="">

                    <input
                        type="search"
                        placeholder="매장명 또는 지역을 입력하세요">

                </label>

            </div>


            <!-- 쿠폰 배너 -->
            <section class="coupon-banner">

                <div>

                    <h1 class="coupon-title">
                        첫 결제 10% 할인 쿠폰
                    </h1>

                    <p class="coupon-description">
                        지금 바로 받기
                    </p>

                </div>

                <img
                    src="./icons/coupon.svg"
                    alt="10퍼센트 할인 쿠폰"
                    class="coupon-image">

            </section>


            <!-- 추천 매장 -->
            <section class="section">

                <div class="section-header">

                    <h2 class="section-title">
                        추천 매장
                    </h2>

                    <a
                        href="./search&filter.html"
                        class="more-link">

                        <span>
                            더보기
                        </span>

                        <img
                            src="./icons/next.svg"
                            alt="">

                    </a>

                </div>


                <article class="store-card">

                    <div class="store-thumbnail">

                        <img
                            src="./images/user.png"
                            alt="워셔타운 강남점">

                    </div>

                    <div class="store-content">

                        <div class="store-title-row">

                            <h3 class="store-name">
                                워셔타운 강남점
                            </h3>

                            <button
                                type="button"
                                class="favorite-button"
                                aria-label="즐겨찾기">

                                <img
                                    src="./icons/heart.svg"
                                    alt="">

                            </button>

                        </div>

                        <div class="store-meta">

                            <span>
                                50m
                            </span>

                            <span>
                                운영중
                            </span>

                        </div>

                        <div class="store-status">

                            <span>
                                사용 가능
                                <strong class="available-count">
                                    6대
                                </strong>
                            </span>

                            <span>
                                혼잡도
                                <strong class="congestion-normal">
                                    보통
                                </strong>
                            </span>

                        </div>

                    </div>

                </article>

            </section>


            <!-- 최근 이용 매장 -->
            <section class="section">

                <h2 class="section-title">
                    최근 이용 매장
                </h2>

                <article class="recent-card">

                    <div class="store-thumbnail">

                        <img
                            src="./images/user.png"
                            alt="워셔타운 역삼점">

                    </div>

                    <div class="recent-content">

                        <h3 class="recent-store-name">
                            워셔타운 역삼점
                        </h3>

                        <p class="recent-date">
                            22.05.20 이용
                        </p>

                    </div>

                </article>

            </section>

        </div>

    </main>


    <!-- 하단 고정 내비게이션 -->
    <nav class="bottom-navigation">

        <a
            href="./home.html"
            class="nav-item active">

            <img
                src="./icons/home.svg"
                alt="">

            <span>
                홈
            </span>

        </a>


        <a
            href="./storelist.html"
            class="nav-item">

            <img
                src="./icons/search.svg"
                alt="">

            <span>
                매장찾기
            </span>

        </a>


        <a
            href="./alarm.html"
            class="nav-item">

            <img
                src="./icons/bell.svg"
                alt="">

            <span>
                알림
            </span>

        </a>


        <a
            href="./mypage.html"
            class="nav-item">

            <img
                src="./icons/person.svg"
                alt="">

            <span>
                마이페이지
            </span>

        </a>

    </nav>

</div>

</body>

</html>
